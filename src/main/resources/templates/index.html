<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Video AI | Cloud Processor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --accent-color: #0d6efd;
            --gradient-primary: linear-gradient(135deg, #6610f2 0%, #0d6efd 100%);
        }

        body {
            background-color: #0b0e14;
            color: #e9ecef;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -1px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .upload-section {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            padding: 60px 20px;
        }

        .custom-file-upload {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: block;
            padding: 40px 20px;
            cursor: pointer;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            text-align: center;
            margin-bottom: 20px;
        }

        .custom-file-upload:hover {
            border-color: #0d6efd;
            background: rgba(13, 110, 253, 0.1);
            box-shadow: 0 0 20px rgba(13, 110, 253, 0.2);
        }

        input[type="file"] {
            display: none;
        }

        .file-name-display {
            color: #0d6efd;
            font-weight: 600;
            margin-top: 15px;
            display: block;
            font-size: 0.9rem;
        }

        .video-card {
            overflow: hidden;
            height: 100%;
        }

        .video-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-color);
        }

        .card-img-container {
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .video-card img {
            height: 200px;
            width: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            opacity: 0.8;
        }

        .btn-gradient {
            background: var(--gradient-primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 10px;
            transition: transform 0.2s ease;
        }

        .btn-gradient:hover {
            transform: scale(1.02);
            color: white;
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
        }

        .badge-cloud {
            background: rgba(13, 110, 253, 0.1);
            color: #0d6efd;
            border: 1px solid rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg border-bottom border-secondary mb-5">
    <div class="container">
        <a class="navbar-brand fs-3" href="#"><i class="bi bi-cpu-fill me-2"></i>NEXUS VIDEO</a>
        <div class="d-flex align-items-center">
                <span class="badge badge-cloud rounded-pill px-3 py-2">
                    <i class="bi bi-cloud-check-fill me-1"></i> Azure Storage Active
                </span>
        </div>
    </div>
</nav>

<main class="container">

    <section class="upload-section text-center mb-5 animate__animated animate__fadeIn">
        <div class="col-lg-7 mx-auto">
            <h1 class="display-4 fw-bold mb-3">AI Video Processor</h1>
            <p class="lead mb-5 text-secondary">Procesare automata FFmpeg cu stocare securizata in Azure Cloud.</p>

            <div th:if="${error}" class="alert alert-danger mb-4 glass-card border-danger text-white">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/videos/upload}" method="post" enctype="multipart/form-data" class="glass-card p-4">
                <label for="file-upload" class="custom-file-upload">
                    <i class="bi bi-cloud-arrow-up-fill display-4 text-primary mb-3 d-block animate__animated animate__bounce animate__infinite animate__slow"></i>
                    <span id="label-text" class="fw-bold">Apasa aici</span>
                    <span id="file-name" class="file-name-display"></span>
                </label>

                <input id="file-upload" type="file" name="file"
                       accept="video/mp4,video/x-matroska,video/quicktime,video/x-msvideo"
                       onchange="updateFileName(this)" required/>

                <button type="submit" id="submit-btn" class="btn btn-gradient w-100 py-3 mt-2 fs-5">
                    <i class="bi bi-rocket-takeoff-fill me-2"></i>Start Processing
                </button>

                <div class="mt-3">
                    <small class="text-muted text-uppercase fw-semibold" style="font-size: 0.7rem;">
                        MP4, MOV, AVI • Limita 50MB
                    </small>
                </div>
            </form>
        </div>
    </section>

    <div class="d-flex justify-content-between align-items-center mb-4 px-2">
        <h3 class="fw-bold"><i class="bi bi-collection-play-fill me-2 text-primary"></i>Media Library</h3>
        <span class="text-secondary small" th:text="${videos.size() + ' fișiere în baza de date'}"></span>
    </div>

    <div class="row g-4 mb-5">
        <div th:each="v, iterStat : ${videos}" class="col-md-6 col-lg-4 animate__animated animate__fadeInUp"
             th:style="'animation-delay: ' + ${iterStat.index * 0.1} + 's'">

            <div class="card glass-card video-card">
                <div class="card-img-container">
                    <img th:src="${v.thumbnailUrl}" class="card-img-top" alt="Thumbnail">
                </div>

                <div class="card-body">
                    <h6 class="card-title text-truncate fw-bold mb-3" th:text="${v.title}">Nume Fisier</h6>
                    <div class="row g-2">
                        <div class="col-8">
                            <a th:href="${v.videoUrl}" class="btn btn-sm btn-gradient w-100" download>
                                <i class="bi bi-play-fill me-1"></i> Video + Thumb
                            </a>
                        </div>
                        <div class="col-4">
                            <a th:href="${v.thumbnailUrl}" class="btn btn-sm btn-outline-secondary w-100" target="_blank" download>
                                <i class="bi bi-image"></i> JPG
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(videos)}" class="col-12 text-center py-5 glass-card mx-2">
            <i class="bi bi-camera-reels text-secondary display-1 mb-3 d-block"></i>
            <h4 class="text-secondary">Nu am gasit inregistrare</h4>
            <p class="text-muted">Urca un videoclip pentru a incepe procesarea.</p>
        </div>
    </div>
</main>

<script>
    function updateFileName(input) {
        const file = input.files[0];
        const displaySpan = document.getElementById('file-name');
        const labelText = document.getElementById('label-text');
        const submitBtn = document.getElementById('submit-btn');

        if (!file) return;

        if (!file.type.startsWith('video/')) {
            alert("EROARE: Fisierul selectat nu este un videoclip!\nTe rugam sa alegi un format valid (MP4, MKV, MOV, AVI).");

            input.value = "";
            displaySpan.textContent = "";
            labelText.textContent = "Apasa aici";
            return;
        }

        displaySpan.textContent = "Selectat: " + file.name;
        labelText.textContent = "Schimba videoclipul";
        displaySpan.classList.add('animate__animated', 'animate__fadeInDown');
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
